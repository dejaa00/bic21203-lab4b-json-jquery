<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 2 — Retrieve and Display JSON Data</title>
</head>
<body>
  <h1>Book Collection Details</h1>

  <p><strong>(a) Title of the first book:</strong> <span id="firstBookTitle"></span></p>
  <p><strong>(b) Author of the second book:</strong> <span id="secondBookAuthor"></span></p>

  <h2>(c) Genres Grouped by Book Title</h2>
  <ul id="genresList"></ul>

  <p id="errorMessage" role="status" aria-live="polite" style="color: red;"></p>

  <script>
    async function loadBooks() {
      const firstBookTitleEl = document.getElementById("firstBookTitle");
      const secondBookAuthorEl = document.getElementById("secondBookAuthor");
      const genresListEl = document.getElementById("genresList");
      const errorMessageEl = document.getElementById("errorMessage");

      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        // Validate structure before accessing properties
        if (!data.books || data.books.length < 2) {
          throw new Error("Invalid JSON structure: expected at least two books.");
        }

        // (a) Title of the first book
        firstBookTitleEl.textContent = data.books[0].title;

        // (b) Author of the second book
        secondBookAuthorEl.textContent = data.books[1].author;

        // (c) Genres of both books, clearly grouped by book title
        data.books.forEach((book) => {
          const listItem = document.createElement("li");
          listItem.textContent = `${book.title} — ${book.genres.join(", ")}`;
          genresListEl.appendChild(listItem);
        });
      } catch (error) {
        errorMessageEl.textContent = `Unable to load book data: ${error.message}`;
      }
    }

    loadBooks();
  </script>
</body>
</html>
